# Java version Gradle runs on.
#
# This used to ask for Java 25. The only Java 25 on the dev Mac is the
# runtime bundled with the Antigravity IDE's Java extension, which has no
# `jlink`, so Android builds failed in JdkImageTransform. Java 21 is what
# Android Studio ships (and ~/Library/Java/JavaVirtualMachines/jbr-21.0.11),
# and is fully supported by Gradle 9, AGP 9 and Kotlin 2.4.
#
# To regenerate with auto-download URLs:
#   cd android && ./gradlew updateDaemonJvm --jvm-version=21
toolchainVersion=21
